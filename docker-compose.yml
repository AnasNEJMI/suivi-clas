services:
  postgres:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Aa-14081992-@
      POSTGRES_DB: postgresdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgresdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL : postgresql://admin:Aa-14081992-@@postgres:5432/postgresdb
      
    container_name: ready-backend
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy 

volumes:
  postgres_data:     
